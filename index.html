      /* =====================================================================
       * MOTOR DE ANÁLISIS EMOCIONAL PNL Y FORMATEO DE REPORTE
       * ===================================================================== */
      function countWords(text) {
        const trimmed = (text || '').trim();
        if (!trimmed) {
          return 0;
        }
        return trimmed.split(/\s+/).length;
      }

      function normalizeSpanish(text) {
        return text
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '');
      }

      function extractExcerpt(text, fallback) {
        const cleaned = (text || '').trim().replace(/\s+/g, ' ');
        if (!cleaned) {
          return fallback;
        }
        if (cleaned.length <= 150) {
          return cleaned;
        }
        const sliced = cleaned.slice(0, 147);
        const lastSpace = sliced.lastIndexOf(' ');
        const cut = lastSpace > 80 ? sliced.slice(0, lastSpace) : sliced;
        return `${cut}…`;
      }

      const THEME_RULES = [
        {

        },

            'Lo que dolió en silencio merecía ser nombrado. Nombrar un duelo invisible lo transforma de carga difusa en experiencia integrada.',
          protocol: 'ancla',
        },
        {
          id: 'resilience',
          label: 'Supervivencia cotidiana y dignidad silenciosa',
          keywords: [
            'segu',
            'levant',
            'dia a dia',
            'continu',
            'sobreviv',

          ],
          reflection:
            'No hubo aplausos externos, pero sí una coherencia interna enorme: seguiste presente incluso cuando nadie veía el esfuerzo.',
          protocol: 'ancla',
        },
      ];

      function analyzeSoulInventory(inventory) {
        const resilienceWords = countWords(inventory.resilience);
        const releaseWords = countWords(inventory.releasedExpectations);
        const victoryWords = countWords(inventory.secretVictory);
        const totalWords = resilienceWords + releaseWords + victoryWords;

        const completedPillars = [resilienceWords, releaseWords, victoryWords].filter(
          (count) => count > 0
        ).length;

        const combinedNormalized = normalizeSpanish(
          `${inventory.resilience} ${inventory.releasedExpectations} ${inventory.secretVictory}`
        );

        const matchedThemes = [];
        const protocolScores = {
          respiracion: 0,
          ancla: 0,
          corte: 0,
        };

        for (const rule of THEME_RULES) {
          let hits = 0;
          for (const keyword of rule.keywords) {
            if (combinedNormalized.includes(keyword)) {
              hits += 1;
            }
          }
          if (hits > 0) {
            matchedThemes.push({
              id: rule.id,
              label: rule.label,
              reflection: rule.reflection,
            });
            protocolScores[rule.protocol] += hits;
          }
        }

        if (matchedThemes.length === 0) {
          matchedThemes.push({
            id: 'presence',
            label: 'Presencia honesta ante el cierre de ciclo',
            reflection:
              'Poner tus vivencias por escrito interrumpe el piloto automático de fin de año y te devuelve un lugar seguro desde donde mirarte con compasión.',
          });
        }

        let recommendedProtocol = 'respiracion';
        if (
          protocolScores.corte > protocolScores.respiracion &&
          protocolScores.corte >= protocolScores.ancla
        ) {
          recommendedProtocol = 'corte';
        } else if (
          protocolScores.ancla > protocolScores.respiracion &&
          protocolScores.ancla > protocolScores.corte
        ) {
          recommendedProtocol = 'ancla';
        }

        const protocolReasons = {
          respiracion:
            'La Respiración Cuadrada 4-4-4-4 ayudará a tu sistema nervioso a salir del estado de alerta sostenida y validar el descanso.',
          ancla:
            'El Ancla Somática de Autocontención te permitirá darle sostén físico a las emociones nombradas sin sentir que desbordan tu cuerpo.',
          corte:
            'El Corte Kinestésico de Frecuencia reforzará en tu fisiología la decisión de soltar expectativas y cargas que ya no te pertenecen.',
        };

        let headline = 'Has dado forma visible a lo que sostenías en silencio.';
        if (completedPillars === 3 && totalWords >= 45) {
          headline =
            'Un inventario lúcido: reconoces tu peso, sueltas lo ajeno y honras tu verdad.';
        } else if (releaseWords > resilienceWords && releaseWords > victoryWords) {
          headline = 'Tu centro de gravedad hoy pide ligereza y desapego consciente.';
        } else if (victoryWords >= 12) {
          headline = 'Tu victoria íntima confirma que creciste incluso en terreno difícil.';
        }

        const reframeMessage =
          completedPillars === 3
            ? 'Desde la Programación Neurolingüística, cuando integras lo que sobreviviste, lo que sueltas y lo que lograste en silencio, dejas de pelearte con el calendario. Este cierre no exige euforia: pide verdad, descanso y respeto por tu propio ritmo.'
            : 'Incluso en los trazos breves hay verdad emocional. Puedes volver a ampliar cualquiera de los tres pilares cuando lo necesites; cada palabra escrita ya es un acto de autocuidado.';

        const affirmation =
          releaseWords > 0
            ? 'No le debo al calendario una versión agotada de mí; honro lo que sostuve y elijo avanzar más liviana.'
            : 'Lo que atravesé sin testigos también cuenta; hoy me reconozco, me contengo y suelto la prisa.';

        return {
          analyzedAt: new Date().toISOString(),
          totalWords,
          completedPillars,
          headline,
          reframeMessage,
          recommendedProtocol,
          recommendedReason: protocolReasons[recommendedProtocol],
          themes: matchedThemes.slice(0, 3),
          resilienceExcerpt: extractExcerpt(
            inventory.resilience,
            'Aún pendiente de registrar tu resiliencia cotidiana.'
          ),
          releaseExcerpt: extractExcerpt(
            inventory.releasedExpectations,
            'Aún pendiente de nombrar las expectativas que deseas soltar.'
          ),
          victoryExcerpt: extractExcerpt(
            inventory.secretVictory,
            'Aún pendiente de celebrar tu victoria secreta del año.'
          ),
          affirmation,
        };
      }

      function formatSpanishDate(isoString) {
        try {
          const date = new Date(isoString);
          return new Intl.DateTimeFormat('es-ES', {
            day: 'numeric',
            month: 'long',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
          }).format(date);
        } catch {
          return isoString;
        }
      }

      function protocolLabel(protocol) {
        switch (protocol) {
          case 'respiracion':
            return 'Respiración Cuadrada (4-4-4-4)';
          case 'ancla':
            return 'Ancla Somática de Autocontención';
          case 'corte':
            return 'Corte Kinestésico de Frecuencia';
          default:
            return 'Respiración Cuadrada (4-4-4-4)';
        }
      }

      function buildPlainTextReport(state) {
        const lines = [];
        const generatedDate = formatSpanishDate(new Date().toISOString());

        lines.push('====================================================================');
        lines.push('EL DUELO INVISIBLE — KIT DIGITAL CARLOS LUNA PNL');
        lines.push('Reporte Personal de Auditoría Emocional y Regulación Somática');
        lines.push('====================================================================');
        lines.push(`Fecha de emisión: ${generatedDate}`);
        lines.push(`Inicio de sesión: ${formatSpanishDate(state.startedAt)}`);
        lines.push('');
        lines.push('--------------------------------------------------------------------');
        lines.push('1. INVENTARIO DEL ALMA (ESCRITURA TERAPÉUTICA)');
        lines.push('--------------------------------------------------------------------');
        lines.push('');
        lines.push('A) Resiliencia invisible y supervivencia cotidiana:');
        lines.push(
          state.inventory.resilience.trim() || '(Sin respuesta registrada en esta sección)'
        );
        lines.push('');
        lines.push('B) Expectativas ajenas de las que me despojo:');
        lines.push(
          state.inventory.releasedExpectations.trim() ||
            '(Sin respuesta registrada en esta sección)'
        );
        lines.push('');
        lines.push('C) Mi victoria secreta del año:');
        lines.push(
          state.inventory.secretVictory.trim() || '(Sin respuesta registrada en esta sección)'
        );
        lines.push('');

        if (state.analysis) {
          lines.push('--------------------------------------------------------------------');
          lines.push('2. SÍNTESIS Y REENCUADRE PNL');
          lines.push('--------------------------------------------------------------------');
          lines.push(`Titular de síntesis: ${state.analysis.headline}`);
          lines.push(
            `Palabras escritas: ${state.analysis.totalWords} | Pilares completados: ${state.analysis.completedPillars}/3`
          );
          lines.push('');
          lines.push(`Reencuadre: ${state.analysis.reframeMessage}`);
          lines.push('');
          lines.push('Ejes detectados en tu escritura:');
          for (const theme of state.analysis.themes) {
            lines.push(`- ${theme.label}: ${theme.reflection}`);
          }
          lines.push('');
          lines.push(`Afirmación ancla: "${state.analysis.affirmation}"`);

      /* =====================================================================
       * AUDIO WEB API: CAMPANA ARMÓNICA DE MAYOR VOLUMEN Y CLARIDAD
       * ===================================================================== */
      let sharedAudioCtx = null;

      function getSharedAudioContext() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) {
          return null;
        }
        if (!sharedAudioCtx || sharedAudioCtx.state === 'closed') {
          sharedAudioCtx = new AudioCtx();
        }
        if (sharedAudioCtx.state === 'suspended') {
          sharedAudioCtx.resume().catch(() => {});
        }
        return sharedAudioCtx;
      }

      function playBellChime(mode = 'phase') {
        try {
          const ctx = getSharedAudioContext();
          if (!ctx) {
            return;
          }

          const now = ctx.currentTime;
          const compressor = ctx.createDynamicsCompressor();
          compressor.threshold.setValueAtTime(-12, now);
          compressor.knee.setValueAtTime(18, now);
          compressor.ratio.setValueAtTime(4, now);
          compressor.attack.setValueAtTime(0.005, now);
          compressor.release.setValueAtTime(0.25, now);

          const masterGain = ctx.createGain();
          masterGain.gain.setValueAtTime(0.95, now);

          compressor.connect(masterGain);
          masterGain.connect(ctx.destination);

          const triggerNote = (baseFreq, startOffset, durationSec, peakLevel) => {
            const t0 = now + startOffset;
            const partials = [
              { freq: baseFreq, ratio: 1.0, type: 'sine', decay: durationSec },
              { freq: baseFreq * 2, ratio: 0.42, type: 'sine', decay: durationSec * 0.72 },
              { freq: baseFreq * 3, ratio: 0.16, type: 'triangle', decay: durationSec * 0.48 },
            ];

            for (const partial of partials) {
              const osc = ctx.createOscillator();
              const env = ctx.createGain();
              osc.type = partial.type;
              osc.frequency.setValueAtTime(partial.freq, t0);

              env.gain.setValueAtTime(0.0001, t0);
              env.gain.linearRampToValueAtTime(peakLevel * partial.ratio, t0 + 0.018);
              env.gain.exponentialRampToValueAtTime(0.0001, t0 + partial.decay);

              osc.connect(env);
              env.connect(compressor);
              osc.start(t0);
              osc.stop(t0 + partial.decay + 0.05);
            }
          };

          if (mode === 'complete') {
            triggerNote(528, 0, 1.35, 0.55);
            triggerNote(660, 0.22, 1.55, 0.50);
          } else {
            triggerNote(528, 0, 1.25, 0.60);
          }
        } catch {
          // Ignorar restricciones de reproducción si el navegador las bloquea
        }
      }

                        className="inline-flex items-center justify-center gap-1.5 min-h-[44px] px-4 py-2 rounded-xl bg-[#F3F6F3] hover:bg-[#E7EEE9] text-[#14281D] text-xs font-semibold border border-[#C9D6CD] transition-colors cursor-pointer whitespace-nowrap shrink-0 self-start focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B4332]"
                      >
                        <span>{isGuideOpen ? 'Ocultar guía' : 'Preguntas guía'}</span>
                        {isGuideOpen ? (
                          <IconChevronUp className="w-4 h-4 text-[#9B2226]" />
                        ) : (
                          <IconChevronDown className="w-4 h-4 text-[#9B2226]" />
                        )}
                      </button>
                    </div>

                    {isGuideOpen && (
                      <div className="pt-4 border-t border-[#E6DFD2] space-y-3">
                        <p className="text-xs font-semibold text-[#9B2226]">
                          Disparadores para desbloquear tu escritura
                        </p>
                        <ul className="space-y-2 text-sm text-[#2D4539]">
                          {field.guidingQuestions.map((question, idx) => (
                            <li key={idx} className="flex items-start gap-2.5">
                              <span className="text-[#9B2226] font-semibold tabular-nums">
                                {idx + 1}.
                              </span>
                              <span>{question}</span>
                            </li>
                          ))}
                        </ul>
                        <div className="pt-1">
                          <button
                            type="button"
                            onClick={() => handleInsertStarter(field.key, field.starterSentence)}
                            className="inline-flex items-center gap-1.5 min-h-[40px] px-3.5 py-1.5 rounded-lg text-xs font-semibold text-[#9B2226] bg-[#FBF1EE] hover:bg-[#F6E1DB] border border-[#9B2226]/20 transition-colors cursor-pointer whitespace-nowrap"
                          >
                            <span>Insertar frase disparadora</span>
                          </button>
                        </div>
                      </div>
                    )}

                    <div className="space-y-2">
                      <label htmlFor={`field-${field.key}`} className="sr-only">
                        {field.title}
                      </label>
                      <textarea
                        id={`field-${field.key}`}
                        rows={dynamicRows}
                        value={currentValue}
                        onChange={(event) => handleTextChange(field.key, event.target.value)}
                        placeholder={field.placeholder}
                        className="w-full rounded-xl border border-[#C9D6CD] bg-white px-4 py-3.5 text-[15px] leading-relaxed text-[#14281D] placeholder:text-[#789083] focus:outline-none focus:ring-2 focus:ring-[#9B2226]/25 focus:border-[#9B2226] transition-colors resize-y"
                      />
                      <div className="flex flex-wrap items-center justify-between gap-2 text-xs text-[#4F685B] pt-1">
                        <span>
                          {words > 0
                            ? 'Escrito y respaldado en esta sesión'
                            : 'Espacio listo para tu reflexión'}
                        </span>
                        <span className="tabular-nums">
                          {words} {words === 1 ? 'palabra' : 'palabras'} · {chars} caracteres
                        </span>
                      </div>
                    </div>
                  </section>
                );
              })}
            </div>

            <div className="bg-[#FDFBF7] rounded-2xl border border-[#D4A348]/45 shadow-lg shadow-black/15 p-6 sm:p-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="space-y-1">
                <h3 className="text-base font-bold text-[#14281D]">
                  ¿Lista para integrar lo que escribiste?
                </h3>
                <p className="text-sm text-[#455E51]">
                  Generaremos una síntesis visual con tus ejes emocionales y una recomendación
                  somática.
                </p>
                {validationMessage && (
                  <p className="text-sm font-medium text-[#9B2226] pt-1" role="alert">
                    {validationMessage}
                  </p>
                )}
              </div>

              <button
                type="button"
                onClick={handleAnalyzeClick}
                className="inline-flex items-center justify-center gap-2.5 min-h-[48px] px-6 py-3 rounded-xl bg-[#9B2226] hover:bg-[#7D191D] active:scale-[0.99] text-white font-semibold text-sm sm:text-base shadow-sm transition-all cursor-pointer whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#9B2226] focus-visible:ring-offset-2"
              >
                <IconSparkles className="w-4 h-4" />
                <span>Guardar y Analizar Mis Respuestas</span>
              </button>
            </div>

            {analysis && (
              <section
                ref={summaryRef}
                aria-live="polite"
                className="bg-[#FDFBF7] rounded-2xl border border-[#D4A348]/60 shadow-lg shadow-black/20 overflow-hidden"
              >
                <div className="bg-[#FBF5E6] px-6 sm:px-8 py-6 border-b border-[#E5D7B8] flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div className="space-y-1.5">
                    <div className="flex items-center gap-2 text-xs font-semibold text-[#9B2226]">
                      <IconCheckCircle className="w-4 h-4" />
                      <span>Tarjeta de Síntesis Emocional · Reencuadre PNL</span>
                    </div>
                    <h2 className="text-xl sm:text-2xl font-bold text-[#14281D]">
                      {analysis.headline}
                    </h2>
                  </div>

                  <div className="text-xs text-[#455E51] tabular-nums shrink-0">
                    {analysis.totalWords} palabras · {analysis.completedPillars}/3 pilares
                  </div>
                </div>

                <div className="p-6 sm:p-8 space-y-8">
                  <p className="text-[15px] sm:text-base text-[#2D4539] leading-relaxed max-w-3xl">
                    {analysis.reframeMessage}
                  </p>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6 pt-6 border-t border-[#E6DFD2]">
                    <div className="space-y-2">
                      <p className="text-xs font-semibold text-[#9B2226]">Resiliencia nombrada</p>
                      <p className="text-sm text-[#14281D] leading-relaxed">
                        “{analysis.resilienceExcerpt}”
                      </p>
                    </div>
                    <div className="space-y-2 md:border-l md:border-[#E6DFD2] md:pl-6">
                      <p className="text-xs font-semibold text-[#1B4332]">Mandato que sueltas</p>
                      <p className="text-sm text-[#14281D] leading-relaxed">
                        “{analysis.releaseExcerpt}”
                      </p>
                    </div>
                    <div className="space-y-2 md:border-l md:border-[#E6DFD2] md:pl-6">
                      <p className="text-xs font-semibold text-[#9B2226]">Victoria íntima</p>
                      <p className="text-sm text-[#14281D] leading-relaxed">
                        “{analysis.victoryExcerpt}”
                      </p>
                    </div>
                  </div>

                  <div className="pt-6 border-t border-[#E6DFD2] space-y-4">
                    <h3 className="text-sm font-bold text-[#14281D]">
                      Patrones emocionales observados en tu texto
                    </h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      {analysis.themes.map((theme) => (
                        <div key={theme.id} className="space-y-1.5">
                          <p className="text-sm font-semibold text-[#14281D]">{theme.label}</p>
                          <p className="text-sm text-[#455E51] leading-relaxed">
                            {theme.reflection}
                          </p>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="pt-6 border-t border-[#E6DFD2] flex flex-col lg:flex-row lg:items-center justify-between gap-6">
                    <div className="space-y-2 max-w-2xl">
                      <p className="text-xs font-semibold text-[#9B2226]">
                        Frase ancla para tu cierre de año
                      </p>
                      <p className="text-base sm:text-lg font-semibold text-[#14281D] leading-snug">
                        “{analysis.affirmation}”
                      </p>
                      <p className="text-sm text-[#455E51] pt-1">
                        Sugerencia somática:{' '}
                        <span className="font-semibold text-[#14281D]">
                          {protocolLabel(analysis.recommendedProtocol)}
                        </span>{' '}
                        — {analysis.recommendedReason}
                      </p>
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3 shrink-0">
                      <button
                        type="button"
                        onClick={() => onGoToSomatic(analysis.recommendedProtocol)}
                        className="inline-flex items-center justify-center gap-2 min-h-[48px] px-5 py-3 rounded-xl bg-[#9B2226] hover:bg-[#7D191D] text-white font-semibold text-sm transition-colors cursor-pointer whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#9B2226]"
                      >
                        <IconWind className="w-4 h-4" />
                        <span>Ir al Botiquín Somático</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => onNavigate('resumen')}
                        className="inline-flex items-center justify-center gap-2 min-h-[48px] px-5 py-3 rounded-xl bg-[#F3F6F3] hover:bg-[#E7EEE9] text-[#14281D] font-semibold text-sm border border-[#C9D6CD] transition-colors cursor-pointer whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B4332]"
                      >
                        <IconFileText className="w-4 h-4 text-[#9B2226]" />
                        <span>Ver Resumen</span>
                        <IconArrowRight className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                </div>
              </section>
            )}
          </div>
        );
      }

      /* =====================================================================
       * PANTALLA 3: BOTIQUÍN DE EMERGENCIA SOMÁTICA
       * ===================================================================== */
      const PHASE_DURATION_MS = 4000;
      const FULL_CYCLE_MS = PHASE_DURATION_MS * 4;

      const BOX_PHASES = [
        {
          id: 'inhale',
          label: 'Inhala suavemente',
          instruction: 'Lleva el aire por la nariz hacia el abdomen sin forzar los hombros.',
          sideLabel: 'Lado 1 · Entrada',
        },
        {
          id: 'holdFull',
          label: 'Sostén en calma',
          instruction: 'Permite que el aire repose dentro sin apretar la mandíbula ni el pecho.',
          sideLabel: 'Lado 2 · Pausa llena',
        },
        {
          id: 'exhale',
          label: 'Exhala lento',
          instruction:
            'Suelta el aire despacio por la boca o nariz, dejando caer el peso de los brazos.',
          sideLabel: 'Lado 3 · Descarga',
        },
        {
          id: 'holdEmpty',
          label: 'Sostén en vacío',
          instruction:
            'Descansa en el silencio breve antes de que el cuerpo pida el siguiente aire.',
          sideLabel: 'Lado 4 · Quietud',
        },
      ];

      const ANCHOR_STEPS = [
        {
          title: 'Aterrizaje plantar y peso corporal',
          durationSec: 25,
          bodyCue: 'Planta de los pies · Silla o suelo',
          pnlInstruction:
            'Apoya ambas plantas firmemente en el suelo. Siente la gravedad sosteniendo tus piernas y tu cadera: no tienes que cargar tu propio peso sola ahora mismo.',
        },
        {
          title: 'Mano en el esternón y presión cálida',
          durationSec: 30,
          bodyCue: 'Palma abierta · Centro del pecho',
          pnlInstruction:
            'Coloca una mano abierta en el centro de tu pecho con presión amable y firme. Imagina que esa mano le comunica a tu amígdala: "En este instante estamos a salvo".',
        },
        {
          title: 'Abrazo de mariposa y contención bilateral',
          durationSec: 35,
          bodyCue: 'Brazos cruzados · Hombros o costados',
          pnlInstruction:
            'Cruza tus brazos suavemente tomando tus hombros o brazos contrarios. Alterna toques muy lentos (izquierda, derecha, izquierda) mientras respiras sin prisa.',
        },
        {
          title: 'Sellado de ancla verbal en PNL',
          durationSec: 20,
          bodyCue: 'Postura erguida y suave · Exhalación larga',
          pnlInstruction:
            'Mantén el contacto cálido y repite en voz baja o mentalmente: "Reconozco lo que siento, me contengo y avanzo a mi ritmo". Suelta las manos despacio al terminar.',
        },
      ];

      const FREQUENCY_CUT_STEPS = [
        {
          title: 'Ruptura de postura y eje físico',
          durationSec: 15,
          bodyCue: 'Levántate o cambia de ángulo',
          pnlInstruction:
            'Si estabas encorvada frente a una pantalla o rumiando un pensamiento, ponte de pie o cambia de postura de inmediato. Mira un punto distinto de la habitación.',
        },
        {
          title: 'Expansión de visión periférica (Modo Panorámico)',
          durationSec: 20,
          bodyCue: 'Mirada suave · 180 grados',
          pnlInstruction:
            'Fija la vista en un punto al frente y, sin mover los ojos, amplía tu atención hacia las paredes laterales. La visión panorámica desactiva la respuesta de túnel y alerta.',
        },
        {
          title: 'Descarga kinestésica de brazos y hombros',
          durationSec: 20,
          bodyCue: 'Sacudida consciente · Mandíbula suelta',
          pnlInstruction:
            'Sube los hombros hacia las orejas tres segundos y déjalos caer de golpe al exhalar. Sacude suavemente tus manos y muñecas como quitando polvo acumulado.',
        },
        {
          title: 'Doble suspiro fisiológico',
          durationSec: 20,
          bodyCue: '2 inhalaciones nasales · 1 exhalación larga',
          pnlInstruction:
            'Inhala profundo por la nariz, toma un segundo sorbo corto de aire arriba para abrir los alvéolos, y exhala largo y audible por la boca. Repite tres veces.',
        },
        {
          title: 'Reanclaje de frecuencia presente',
          durationSec: 15,
          bodyCue: 'Chasquido o toque en el antebrazo',
          pnlInstruction:
            'Presiona suavemente tu muñeca mientras exhalas con serenidad y di: "Corto la inercia del año pasado; habito este momento con claridad".',
        },
      ];

      function SomaticKitScreen({
        activeProtocol,
        onSelectProtocol,
        stats,
        onCompleteBoxCycle,
        onCompleteAnchor,
        onCompleteFrequencyCut,
        onNavigate,
      }) {
        const [boxRunning, setBoxRunning] = useState(false);
        const [targetCycles, setTargetCycles] = useState(4);
        const [sessionCycles, setSessionCycles] = useState(0);
        const [elapsedInCycleMs, setElapsedInCycleMs] = useState(0);
        const [soundEnabled, setSoundEnabled] = useState(true);
        const [boxCompletedBanner, setBoxCompletedBanner] = useState(false);

        const lastTickRef = useRef(null);
        const prevPhaseRef = useRef(0);

        const [anchorStepIdx, setAnchorStepIdx] = useState(0);
        const [anchorSecondsLeft, setAnchorSecondsLeft] = useState(ANCHOR_STEPS[0].durationSec);
        const [anchorRunning, setAnchorRunning] = useState(false);
        const [anchorDoneFlash, setAnchorDoneFlash] = useState(false);

        const [cutStepIdx, setCutStepIdx] = useState(0);
        const [cutSecondsLeft, setCutSecondsLeft] = useState(
          FREQUENCY_CUT_STEPS[0].durationSec
        );
        const [cutRunning, setCutRunning] = useState(false);
        const [cutDoneFlash, setCutDoneFlash] = useState(false);

        useEffect(() => {
          if (!boxRunning) {
            lastTickRef.current = null;
            return;
          }

          let rafId = 0;
          const step = (now) => {
            if (lastTickRef.current === null) {
              lastTickRef.current = now;
            }
            const delta = now - lastTickRef.current;
            lastTickRef.current = now;

            setElapsedInCycleMs((prev) => {
              const next = prev + delta;
              const newPhaseIndex = Math.floor((next % FULL_CYCLE_MS) / PHASE_DURATION_MS);
              if (newPhaseIndex !== prevPhaseRef.current) {
                prevPhaseRef.current = newPhaseIndex;
                if (soundEnabled) {
                  playBellChime('phase');
                }
              }

              if (next >= FULL_CYCLE_MS) {
                const remainder = next % FULL_CYCLE_MS;
                onCompleteBoxCycle();
                setSessionCycles((currCycles) => {
                  const updated = currCycles + 1;
                  if (updated >= targetCycles) {
                    setBoxRunning(false);
                    setBoxCompletedBanner(true);
                    if (soundEnabled) {
                      playBellChime('complete');
                    }
                  }
                  return updated;
                });
                return remainder;
              }
              return next;
            });

            rafId = window.requestAnimationFrame(step);
          };

          rafId = window.requestAnimationFrame(step);
          return () => window.cancelAnimationFrame(rafId);
        }, [boxRunning, targetCycles, soundEnabled, onCompleteBoxCycle]);

        useEffect(() => {
          if (!anchorRunning) {
            return;
          }
          const timer = window.setInterval(() => {
            setAnchorSecondsLeft((prev) => {
              if (prev > 1) {
                return prev - 1;
              }
              if (anchorStepIdx < ANCHOR_STEPS.length - 1) {
                const nextIdx = anchorStepIdx + 1;
                setAnchorStepIdx(nextIdx);
                if (soundEnabled) {
                  playBellChime('phase');
                }
                return ANCHOR_STEPS[nextIdx].durationSec;
              }
              setAnchorRunning(false);
              setAnchorDoneFlash(true);
              if (soundEnabled) {
                playBellChime('complete');
              }
              onCompleteAnchor();
              return 0;
            });
          }, 1000);
          return () => window.clearInterval(timer);
        }, [anchorRunning, anchorStepIdx, soundEnabled, onCompleteAnchor]);

        useEffect(() => {
          if (!cutRunning) {
            return;
          }
          const timer = window.setInterval(() => {
            setCutSecondsLeft((prev) => {
              if (prev > 1) {
                return prev - 1;
              }
              if (cutStepIdx < FREQUENCY_CUT_STEPS.length - 1) {
                const nextIdx = cutStepIdx + 1;
                setCutStepIdx(nextIdx);
                if (soundEnabled) {
                  playBellChime('phase');
                }
                return FREQUENCY_CUT_STEPS[nextIdx].durationSec;
              }
              setCutRunning(false);
              setCutDoneFlash(true);
              if (soundEnabled) {
                playBellChime('complete');
              }
              onCompleteFrequencyCut();
              return 0;
            });
          }, 1000);
          return () => window.clearInterval(timer);
        }, [cutRunning, cutStepIdx, soundEnabled, onCompleteFrequencyCut]);

        const phaseIndex = Math.min(3, Math.floor(elapsedInCycleMs / PHASE_DURATION_MS));
        const currentPhase = BOX_PHASES[phaseIndex];
        const msWithinPhase = elapsedInCycleMs % PHASE_DURATION_MS;
        const phaseProgress = msWithinPhase / PHASE_DURATION_MS;
        const secondsRemaining = Math.max(
          1,
          Math.ceil((PHASE_DURATION_MS - msWithinPhase) / 1000)
        );

        let circleScale = 0.76;
        if (currentPhase.id === 'inhale') {
          circleScale = 0.76 + 0.34 * phaseProgress;
        } else if (currentPhase.id === 'holdFull') {
          circleScale = 1.1;
        } else if (currentPhase.id === 'exhale') {
          circleScale = 1.1 - 0.34 * phaseProgress;
        } else {
          circleScale = 0.76;
        }

        const handleToggleSound = () => {
          setSoundEnabled((prev) => {
            const next = !prev;
            if (next) {
              playBellChime('phase');
            }
            return next;
          });
        };

        const handleToggleBox = () => {
          if (!boxRunning) {
            setBoxCompletedBanner(false);
            if (sessionCycles >= targetCycles) {
              setSessionCycles(0);
              setElapsedInCycleMs(0);
              prevPhaseRef.current = 0;
            }
            if (soundEnabled) {
              playBellChime('phase');
            }
          }
          setBoxRunning((prev) => !prev);
        };

        const handleResetBox = () => {
          setBoxRunning(false);
          setElapsedInCycleMs(0);
          setSessionCycles(0);
          setBoxCompletedBanner(false);
          prevPhaseRef.current = 0;
        };

        const handleSelectAnchorStep = (index) => {
          setAnchorRunning(false);
          setAnchorDoneFlash(false);
          setAnchorStepIdx(index);
          setAnchorSecondsLeft(ANCHOR_STEPS[index].durationSec);
        };

        const handleSelectCutStep = (index) => {
          setCutRunning(false);
          setCutDoneFlash(false);
          setCutStepIdx(index);
          setCutSecondsLeft(FREQUENCY_CUT_STEPS[index].durationSec);
        };

        const currentAnchorStep = ANCHOR_STEPS[anchorStepIdx];
        const currentCutStep = FREQUENCY_CUT_STEPS[cutStepIdx];

        return (
          <div className="space-y-8">
            <header className="bg-[#FDFBF7] rounded-2xl border border-[#D4A348]/45 shadow-lg shadow-black/15 p-6 sm:p-8 flex flex-col lg:flex-row lg:items-end justify-between gap-6">
              <div className="space-y-3 max-w-2xl">
                <div className="flex flex-wrap items-center gap-2 text-xs font-medium text-[#4F685B]">
                  <span className="text-[#9B2226] font-semibold">Módulo 02</span>
                  <span aria-hidden="true">·</span>
                  <span>Regulación del Sistema Nervioso</span>
                  <span aria-hidden="true">·</span>
                  <span>Uso inmediato en momentos de saturación</span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-bold text-[#14281D] tracking-tight">
                  Botiquín de Emergencia Somática
                </h1>
                <p className="text-[15px] text-[#2D4539] leading-relaxed">
                  Cuando la mente sigue rumiando el año, razonar no basta: es necesario hablarle al
                  cuerpo en su propio idioma. Elige una de las tres herramientas guiadas según lo
                  que necesites hoy.
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-5 pt-4 lg:pt-0 border-t lg:border-t-0 border-[#E6DFD2] shrink-0">
                <div>
                  <p className="text-xs text-[#4F685B]">Ciclos respiración</p>
                  <p className="text-2xl font-bold text-[#14281D] tabular-nums">
                    {stats.boxBreathingCycles}
                  </p>
                </div>
                <div className="h-9 w-px bg-[#D9CEBC]" aria-hidden="true" />
                <div>
                  <p className="text-xs text-[#4F685B]">Prácticas guiadas</p>
                  <p className="text-2xl font-bold text-[#9B2226] tabular-nums">
                    {stats.anchorCompletedCount + stats.frequencyCutCompletedCount}
                  </p>
                </div>
              </div>
            </header>

            <div
              role="tablist"
              aria-label="Protocolos somáticos"
              className="grid grid-cols-1 sm:grid-cols-3 gap-2 p-1.5 bg-[#11281E] border border-[#2B5240] rounded-2xl"
            >
              <button
                type="button"
                role="tab"
                aria-selected={activeProtocol === 'respiracion'}
                onClick={() => onSelectProtocol('respiracion')}
                className={`flex items-center justify-center gap-2 min-h-[46px] px-4 py-2.5 rounded-xl text-sm font-semibold transition-all cursor-pointer whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#D4A348] ${
                  activeProtocol === 'respiracion'
                    ? 'bg-[#FDFBF7] text-[#14281D] shadow-sm'
                    : 'text-[#C7D6CE] hover:text-[#FAF7F0]'
                }`}
              >
                <IconWind
                  className={`w-4 h-4 shrink-0 ${
                    activeProtocol === 'respiracion' ? 'text-[#9B2226]' : 'text-[#F2C97D]'
                  }`}
                />
                <span>Respiración Cuadrada</span>
              </button>

              <button
                type="button"
                role="tab"
                aria-selected={activeProtocol === 'ancla'}
                onClick={() => onSelectProtocol('ancla')}
                className={`flex items-center justify-center gap-2 min-h-[46px] px-4 py-2.5 rounded-xl text-sm font-semibold transition-all cursor-pointer whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#D4A348] ${
                  activeProtocol === 'ancla'
                    ? 'bg-[#FDFBF7] text-[#14281D] shadow-sm'
                    : 'text-[#C7D6CE] hover:text-[#FAF7F0]'
                }`}
              >
                <IconHandHeart
                  className={`w-4 h-4 shrink-0 ${
                    activeProtocol === 'ancla' ? 'text-[#9B2226]' : 'text-[#F2C97D]'
                  }`}
                />
                <span>Ancla de Autocontención</span>
              </button>

                            playBellChime('phase');
                          }
                          setCutRunning((prev) => !prev);
                        }}
                        className="inline-flex items-center justify-center gap-2 min-h-[48px] px-6 py-3 rounded-xl bg-[#9B2226] hover:bg-[#7D191D] text-white font-semibold text-sm transition-colors cursor-pointer whitespace-nowrap shrink-0"
                      >
                        {cutRunning ? (
                          <>
                            <IconPause className="w-4 h-4" />
                            <span>Pausar guía</span>
                          </>
                        ) : (
                          <>
                            <IconPlay className="w-4 h-4" />
                            <span>Iniciar temporizador</span>
                          </>
                        )}
                      </button>

                      <button
                        type="button"
                        onClick={() => handleSelectCutStep(0)}
                        className="inline-flex items-center justify-center gap-2 min-h-[48px] px-4 py-3 rounded-xl bg-white hover:bg-[#E7EEE9] text-[#14281D] font-medium text-sm border border-[#C9D6CD] transition-colors cursor-pointer whitespace-nowrap shrink-0"
                      >
                        <IconRotateCcw className="w-4 h-4" />
                        <span>Reiniciar</span>
                      </button>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        disabled={cutStepIdx === 0}
                        onClick={() => handleSelectCutStep(cutStepIdx - 1)}
                        className="inline-flex items-center justify-center gap-1 min-h-[44px] px-3.5 py-2 rounded-xl bg-white border border-[#C9D6CD] text-sm font-medium text-[#14281D] disabled:opacity-40 cursor-pointer disabled:cursor-not-allowed"
                      >
                        <IconChevronLeft className="w-4 h-4" />
                        <span>Anterior</span>
                      </button>
                      {cutStepIdx < FREQUENCY_CUT_STEPS.length - 1 ? (
                        <button
                          type="button"
                          onClick={() => handleSelectCutStep(cutStepIdx + 1)}
                          className="inline-flex items-center justify-center gap-1 min-h-[44px] px-3.5 py-2 rounded-xl bg-white border border-[#C9D6CD] text-sm font-medium text-[#14281D] hover:bg-[#E7EEE9] cursor-pointer"
                        >
                          <span>Siguiente</span>
                          <IconChevronRight className="w-4 h-4" />
                        </button>
                      ) : (
                        <button
                          type="button"
                          onClick={() => {
                            setCutRunning(false);
                            setCutDoneFlash(true);
                            if (soundEnabled) {
                              playBellChime('complete');
                            }
                            onCompleteFrequencyCut();
                          }}
                          className="inline-flex items-center justify-center gap-1.5 min-h-[44px] px-4 py-2 rounded-xl bg-[#1B4332] hover:bg-[#143325] text-white text-sm font-semibold cursor-pointer whitespace-nowrap"
                        >
                          <IconCheck className="w-4 h-4" />
                          <span>Registrar práctica</span>
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              </section>
            )}

            <div className="flex justify-end">
              <button
                type="button"
                onClick={() => onNavigate('resumen')}
                className="inline-flex items-center gap-2 min-h-[48px] px-6 py-3 rounded-xl bg-[#D4A348] hover:bg-[#C19139] text-[#11281E] font-semibold text-sm shadow-sm transition-colors cursor-pointer whitespace-nowrap shrink-0"
              >
                <span>Continuar al Resumen y Descarga</span>
                <IconArrowRight className="w-4 h-4" />
              </button>
            </div>
          </div>
        );
      }

      /* =====================================================================
       * PANTALLA 4: RESUMEN Y DESCARGA
       * ===================================================================== */
      function SummaryScreen({
        session,
        onChangeClosingIntention,
        onNavigate,
        onResetSession,
      }) {
        const [copied, setCopied] = useState(false);
        const [confirmingReset, setConfirmingReset] = useState(false);

        const totalWords =
          countWords(session.inventory.resilience) +
          countWords(session.inventory.releasedExpectations) +
          countWords(session.inventory.secretVictory);

        const completedPillars = [
          session.inventory.resilience,
          session.inventory.releasedExpectations,
          session.inventory.secretVictory,
        ].filter((t) => countWords(t) > 0).length;

        const totalSomaticPractices =
          session.somatic.boxBreathingCycles +
          session.somatic.anchorCompletedCount +
          session.somatic.frequencyCutCompletedCount;

        const handleCopyReport = async () => {
          const reportText = buildPlainTextReport(session);
          try {
            await navigator.clipboard.writeText(reportText);
            setCopied(true);
            window.setTimeout(() => setCopied(false), 3000);
          } catch {
            const helper = document.createElement('textarea');
            helper.value = reportText;
            helper.style.position = 'fixed';
            helper.style.opacity = '0';
            document.body.appendChild(helper);
            helper.select();
            document.execCommand('copy');
            document.body.removeChild(helper);
            setCopied(true);
            window.setTimeout(() => setCopied(false), 3000);
          }
        };

        const handleDownloadTxt = () => {
          const reportText = buildPlainTextReport(session);
          const blob = new Blob([reportText], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'el-duelo-invisible-reporte-sesion.txt';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        };

        const handlePrint = () => {
          window.print();
        };

        return (
          <div className="space-y-8">
            <header className="bg-[#FDFBF7] rounded-2xl border border-[#D4A348]/45 shadow-lg shadow-black/15 p-6 sm:p-8 print-card space-y-6">
              <div className="flex flex-col lg:flex-row lg:items-start justify-between gap-6">
                <div className="space-y-2 max-w-2xl">
                  <div className="flex flex-wrap items-center gap-2 text-xs font-medium text-[#4F685B]">
                    <span className="text-[#9B2226] font-semibold">Módulo 03</span>
                    <span aria-hidden="true">·</span>
                    <span>Reporte de Cierre</span>
                    <span aria-hidden="true">·</span>
                    <span>Sesión iniciada el {formatSpanishDate(session.startedAt)}</span>
                  </div>
                  <h1 className="text-2xl sm:text-3xl font-bold text-[#14281D] tracking-tight">
                    Resumen de tu Auditoría Emocional
                  </h1>
                  <p className="text-[15px] text-[#2D4539] leading-relaxed">
                    Aquí tienes todo lo que nombraste, soltaste y practicaste en el cuerpo. Puedes
                    copiarlo a tus notas personales, descargarlo en texto limpio o imprimirlo.
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-3 no-print shrink-0">
                  <button
                    type="button"
                    onClick={handleCopyReport}
                    className="inline-flex items-center justify-center gap-2 min-h-[48px] px-5 py-3 rounded-xl bg-[#9B2226] hover:bg-[#7D191D] text-white font-semibold text-sm transition-colors cursor-pointer whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#9B2226]"
                  >
                    {copied ? (
                      <>
                        <IconCheck className="w-4 h-4" />
                        <span>Reporte copiado</span>
                      </>
                    ) : (
                      <>
                        <IconCopy className="w-4 h-4" />
                        <span>Copiar Reporte</span>
                      </>
                    )}
                  </button>

                  <button
                    type="button"
                    onClick={handleDownloadTxt}
                    className="inline-flex items-center justify-center gap-2 min-h-[48px] px-5 py-3 rounded-xl bg-[#1B4332] hover:bg-[#143325] text-white font-semibold text-sm transition-colors cursor-pointer whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B4332]"
                  >
                    <IconDownload className="w-4 h-4" />
                    <span>Descargar (.txt)</span>
                  </button>

                  <button
                    type="button"
                    onClick={handlePrint}
                    className="inline-flex items-center justify-center gap-2 min-h-[48px] px-4 py-3 rounded-xl bg-[#F3F6F3] hover:bg-[#E7EEE9] text-[#14281D] font-semibold text-sm border border-[#C9D6CD] transition-colors cursor-pointer whitespace-nowrap shrink-0"
                  >
                    <IconPrinter className="w-4 h-4 text-[#9B2226]" />
                    <span>Imprimir / PDF</span>
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-2 lg:grid-cols-4 gap-6 pt-6 border-t border-[#E6DFD2]">
                <div>
                  <p className="text-xs text-[#4F685B]">Pilares escritos</p>
                  <p className="text-2xl font-bold text-[#14281D] tabular-nums mt-0.5">
                    {completedPillars} / 3
                  </p>
                </div>
                <div>
                  <p className="text-xs text-[#4F685B]">Palabras totales</p>
                  <p className="text-2xl font-bold text-[#14281D] tabular-nums mt-0.5">
                    {totalWords}
                  </p>
                </div>
                <div>
                  <p className="text-xs text-[#4F685B]">Ciclos de respiración</p>
                  <p className="text-2xl font-bold text-[#9B2226] tabular-nums mt-0.5">
                    {session.somatic.boxBreathingCycles}
                  </p>
                </div>
                <div>
                  <p className="text-xs text-[#4F685B]">Prácticas somáticas</p>
                  <p className="text-2xl font-bold text-[#1B4332] tabular-nums mt-0.5">
                    {totalSomaticPractices}
                  </p>
                </div>
              </div>
            </header>

            <section className="bg-[#FDFBF7] rounded-2xl border border-[#D4A348]/45 shadow-lg shadow-black/15 p-6 sm:p-8 print-card space-y-6">
              <div className="flex items-center justify-between gap-4 pb-4 border-b border-[#E6DFD2]">
                <div>
                  <p className="text-xs font-semibold text-[#9B2226]">Parte 01</p>
                  <h2 className="text-xl font-bold text-[#14281D]">Inventario del Alma</h2>
                </div>
                <button
                  type="button"
                  onClick={() => onNavigate('inventario')}
                  className="no-print inline-flex items-center gap-1.5 min-h-[40px] px-3.5 py-2 rounded-lg text-xs font-semibold text-[#9B2226] hover:bg-[#FBF1EE] transition-colors cursor-pointer whitespace-nowrap shrink-0"
                >
                  <IconEdit className="w-3.5 h-3.5" />
                  <span>Editar respuestas</span>
                </button>
              </div>

              <div className="space-y-6">
                <div className="space-y-2">
                  <h3 className="text-sm font-bold text-[#14281D]">
                    A) Resiliencia invisible y supervivencia cotidiana
                  </h3>
                  <p className="text-[15px] text-[#2D4539] leading-relaxed whitespace-pre-line">
                    {session.inventory.resilience.trim() ||
                      'Aún no has escrito en este pilar. Puedes volver al Inventario del Alma para completarlo.'}
                  </p>
                </div>

                <div className="pt-5 border-t border-[#E6DFD2] space-y-2">
                  <h3 className="text-sm font-bold text-[#14281D]">
                    B) Expectativas ajenas de las que me despojo
                  </h3>
                  <p className="text-[15px] text-[#2D4539] leading-relaxed whitespace-pre-line">
                    {session.inventory.releasedExpectations.trim() ||
                      'Aún no has escrito en este pilar. Puedes volver al Inventario del Alma para completarlo.'}
                  </p>
                </div>

                <div className="pt-5 border-t border-[#E6DFD2] space-y-2">
                  <h3 className="text-sm font-bold text-[#14281D]">
                    C) Tu victoria secreta del año
                  </h3>
                  <p className="text-[15px] text-[#2D4539] leading-relaxed whitespace-pre-line">
                    {session.inventory.secretVictory.trim() ||
                      'Aún no has escrito en este pilar. Puedes volver al Inventario del Alma para completarlo.'}
                  </p>
                </div>
              </div>

              {session.analysis && (
                <div className="pt-6 border-t border-[#D9CEBC] space-y-3">
                  <p className="text-xs font-semibold text-[#9B2226]">Síntesis PNL generada</p>
                  <p className="text-base font-bold text-[#14281D]">{session.analysis.headline}</p>
                  <p className="text-sm text-[#2D4539] leading-relaxed">
                    {session.analysis.reframeMessage}
                  </p>
                  <p className="text-sm font-semibold text-[#14281D] pt-1">
                    Afirmación ancla: “{session.analysis.affirmation}”
                  </p>
                </div>
              )}
            </section>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <section className="lg:col-span-5 bg-[#FDFBF7] rounded-2xl border border-[#D4A348]/45 shadow-lg shadow-black/15 p-6 sm:p-8 print-card space-y-5">
                <div className="flex items-center justify-between gap-2 pb-4 border-b border-[#E6DFD2]">
                  <div>
                    <p className="text-xs font-semibold text-[#9B2226]">Parte 02</p>
                    <h2 className="text-xl font-bold text-[#14281D]">Registro Somático</h2>
                  </div>
                  <button
                    type="button"
                    onClick={() => onNavigate('botiquin')}
                    className="no-print inline-flex items-center gap-1.5 min-h-[40px] px-3 py-1.5 rounded-lg text-xs font-semibold text-[#9B2226] hover:bg-[#FBF1EE] transition-colors cursor-pointer whitespace-nowrap"
                  >
                    <span>Practicar</span>
                  </button>
                </div>

                <ul className="space-y-4 text-sm">
                  <li className="flex items-center justify-between gap-4">
                    <span className="text-[#2D4539]">Respiración Cuadrada (4-4-4-4)</span>
                    <span className="font-bold text-[#14281D] tabular-nums">
                      {session.somatic.boxBreathingCycles}{' '}
                      {session.somatic.boxBreathingCycles === 1 ? 'ciclo' : 'ciclos'}
                    </span>
                  </li>
                  <li className="flex items-center justify-between gap-4 pt-3 border-t border-[#EAE3D7]">
                    <span className="text-[#2D4539]">Ancla Somática de Autocontención</span>
                    <span className="font-bold text-[#14281D] tabular-nums">
                      {session.somatic.anchorCompletedCount}{' '}
                      {session.somatic.anchorCompletedCount === 1 ? 'sesión' : 'sesiones'}
                    </span>
                  </li>
                  <li className="flex items-center justify-between gap-4 pt-3 border-t border-[#EAE3D7]">
                    <span className="text-[#2D4539]">Corte Kinestésico de Frecuencia</span>
                    <span className="font-bold text-[#14281D] tabular-nums">
                      {session.somatic.frequencyCutCompletedCount}{' '}
                      {session.somatic.frequencyCutCompletedCount === 1 ? 'sesión' : 'sesiones'}
                    </span>
                  </li>
                </ul>

                {session.somatic.lastPracticedProtocol && (
                  <p className="text-xs text-[#4F685B] pt-3 border-t border-[#E6DFD2]">
                    Última herramienta utilizada:{' '}
                    <span className="font-semibold text-[#14281D]">
                      {protocolLabel(session.somatic.lastPracticedProtocol)}
                    </span>
                  </p>
                )}
              </section>

              <section className="lg:col-span-7 bg-[#FDFBF7] rounded-2xl border border-[#D4A348]/45 shadow-lg shadow-black/15 p-6 sm:p-8 print-card space-y-4">
                <div>
                  <p className="text-xs font-semibold text-[#9B2226]">Parte 03</p>
                  <h2 className="text-xl font-bold text-[#14281D]">
                    Intención de cierre para este fin de año
                  </h2>
                  <p className="text-sm text-[#455E51] mt-1">
                    Opcional: escribe una frase breve de trato amable que quieras incluir en tu
                    reporte final.
                  </p>
                </div>

                <textarea
                  rows={4}
                  value={session.closingIntention}
                  onChange={(event) => onChangeClosingIntention(event.target.value)}
                  placeholder="Ejemplo: Me prometo no pelear con el calendario estas semanas; priorizaré el descanso y celebraré mi camino real."
                  className="w-full rounded-xl border border-[#C9D6CD] bg-white px-4 py-3 text-[15px] leading-relaxed text-[#14281D] placeholder:text-[#789083] focus:outline-none focus:ring-2 focus:ring-[#9B2226]/25 focus:border-[#9B2226] transition-colors"
                />

                <div className="pt-2 flex flex-wrap items-center justify-between gap-3 no-print">
                  <span className="text-xs text-[#4F685B]">
                    Incluido automáticamente al copiar o descargar el reporte.
                  </span>

                  {!confirmingReset ? (
                    <button
                      type="button"
                      onClick={() => setConfirmingReset(true)}
                      className="inline-flex items-center gap-1.5 min-h-[40px] px-3.5 py-2 rounded-lg text-xs font-semibold text-[#4F685B] hover:text-[#9B2226] hover:bg-[#FBF1EE] transition-colors cursor-pointer"
                    >
                      <IconRotateCcw className="w-3.5 h-3.5" />
                      <span>Reiniciar sesión</span>
                    </button>
                  ) : (
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-medium text-[#9B2226]">
                        ¿Borrar datos locales?
                      </span>
                      <button
                        type="button"
                        onClick={() => {
                          onResetSession();
                          setConfirmingReset(false);
                        }}
                        className="min-h-[36px] px-3 py-1.5 rounded-lg bg-[#9B2226] text-white text-xs font-semibold cursor-pointer"
                      >
                        Confirmar
                      </button>
                      <button
                        type="button"
                        onClick={() => setConfirmingReset(false)}
                        className="min-h-[36px] px-3 py-1.5 rounded-lg bg-[#F3F6F3] text-[#14281D] text-xs font-semibold border border-[#C9D6CD] cursor-pointer"
                      >
                        Cancelar
                      </button>
                    </div>
                  )}
                </div>
              </section>
            </div>
          </div>
        );
      }

      /* =====================================================================
       * APLICACIÓN PRINCIPAL Y PERSISTENCIA LOCAL
       * ===================================================================== */
      const STORAGE_KEY = 'el_duelo_invisible_kit_v1';

      function createInitialSession() {
        return {
          inventory: {
            resilience: '',
            releasedExpectations: '',
            secretVictory: '',
          },
          analysis: null,
          somatic: {
            boxBreathingCycles: 0,
            anchorCompletedCount: 0,
            frequencyCutCompletedCount: 0,
            lastPracticedProtocol: null,
          },
          closingIntention: '',
          startedAt: new Date().toISOString(),
        };
      }

      function loadSavedSession() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            return createInitialSession();
          }
          const parsed = JSON.parse(raw);
          const base = createInitialSession();
          return {
            inventory: {
              resilience: parsed.inventory?.resilience ?? '',
              releasedExpectations: parsed.inventory?.releasedExpectations ?? '',
              secretVictory: parsed.inventory?.secretVictory ?? '',
            },
            analysis: parsed.analysis ?? null,
            somatic: {
              boxBreathingCycles: parsed.somatic?.boxBreathingCycles ?? 0,
              anchorCompletedCount: parsed.somatic?.anchorCompletedCount ?? 0,
              frequencyCutCompletedCount: parsed.somatic?.frequencyCutCompletedCount ?? 0,
              lastPracticedProtocol: parsed.somatic?.lastPracticedProtocol ?? null,
            },
            closingIntention: parsed.closingIntention ?? '',
            startedAt: parsed.startedAt ?? base.startedAt,
          };
        } catch {
          return createInitialSession();
        }
      }

      const NAV_ITEMS = [
        { id: 'bienvenida', label: 'Bienvenida' },
        { id: 'inventario', label: 'Inventario del Alma' },
        { id: 'botiquin', label: 'Botiquín Somático' },
        { id: 'resumen', label: 'Resumen y Descarga' },
      ];

      function App() {
        const [activeScreen, setActiveScreen] = useState('bienvenida');
        const [activeSomaticProtocol, setActiveSomaticProtocol] = useState('respiracion');
        const [session, setSession] = useState(() => loadSavedSession());

        useEffect(() => {
          try {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
          } catch {
            // Ignorar errores de cuota de almacenamiento
          }
        }, [session]);

        const navigateTo = useCallback((screen) => {
          setActiveScreen(screen);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, []);

        const handleInventoryChange = useCallback((updated) => {
          setSession((prev) => ({
            ...prev,
            inventory: updated,
          }));
        }, []);

        const handleAnalyzeInventory = useCallback(() => {
          setSession((prev) => ({
            ...prev,
            analysis: analyzeSoulInventory(prev.inventory),
          }));
        }, []);

        const handleGoToSomatic = useCallback(
          (protocol) => {
            setActiveSomaticProtocol(protocol);
            navigateTo('botiquin');
          },
          [navigateTo]
        );

        const handleCompleteBoxCycle = useCallback(() => {
          setSession((prev) => ({
            ...prev,
            somatic: {
              ...prev.somatic,
              boxBreathingCycles: prev.somatic.boxBreathingCycles + 1,
              lastPracticedProtocol: 'respiracion',
            },
          }));
        }, []);

        const handleCompleteAnchor = useCallback(() => {
          setSession((prev) => ({
            ...prev,
            somatic: {
              ...prev.somatic,
              anchorCompletedCount: prev.somatic.anchorCompletedCount + 1,
              lastPracticedProtocol: 'ancla',
            },
          }));
        }, []);

        const handleCompleteFrequencyCut = useCallback(() => {
          setSession((prev) => ({
            ...prev,
            somatic: {
              ...prev.somatic,
              frequencyCutCompletedCount: prev.somatic.frequencyCutCompletedCount + 1,
              lastPracticedProtocol: 'corte',
            },
          }));
        }, []);

        const handleClosingIntentionChange = useCallback((value) => {
          setSession((prev) => ({
            ...prev,
            closingIntention: value,
          }));
        }, []);

        const handleResetSession = useCallback(() => {
          const fresh = createInitialSession();
          setSession(fresh);
          try {
            window.localStorage.removeItem(STORAGE_KEY);
          } catch {
            // Ignorar errores de almacenamiento
          }
          navigateTo('bienvenida');
        }, [navigateTo]);

        const hasExistingProgress =
          countWords(session.inventory.resilience) > 0 ||
          countWords(session.inventory.releasedExpectations) > 0 ||
          countWords(session.inventory.secretVictory) > 0 ||
          session.somatic.boxBreathingCycles > 0 ||
          session.somatic.anchorCompletedCount > 0 ||
          session.somatic.frequencyCutCompletedCount > 0;

        return (
          <div className="min-h-screen flex flex-col bg-[#153226] bg-[radial-gradient(ellipse_at_top,_rgba(212,163,72,0.11),_transparent_58%)] text-[#FAF7F0]">
            <header className="sticky top-0 z-30 bg-[#11281E]/95 backdrop-blur-md border-b border-[#2B5240]">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-12 md:h-16 flex items-center justify-between gap-8">
                <button
                  type="button"
                  onClick={() => navigateTo('bienvenida')}
                  className="font-display text-base sm:text-lg font-bold tracking-tight text-[#FAF7F0] hover:text-[#F2C97D] transition-colors whitespace-nowrap shrink-0 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#D4A348] rounded-md"
                >
                  El Duelo Invisible
                </button>

                <nav aria-label="Secciones del kit" className="hidden md:flex items-center gap-6">
                  {NAV_ITEMS.map((item) => {
                    const isActive = activeScreen === item.id;
                    return (
                      <button
                        key={item.id}
                        type="button"
                        onClick={() => navigateTo(item.id)}
                        aria-current={isActive ? 'page' : undefined}
                        className={`py-2 text-sm font-medium transition-colors whitespace-nowrap shrink-0 cursor-pointer border-b-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#D4A348] ${
                          isActive
                            ? 'text-[#F2C97D] border-[#D4A348] font-semibold'
                            : 'text-[#C7D6CE] border-transparent hover:text-[#FAF7F0] hover:border-[#3D6A54]'
                        }`}
                      >
                        {item.label}
                      </button>
                    );
                  })}
                </nav>

                <div className="flex items-center shrink-0">
                  {activeScreen === 'bienvenida' ? (
                    <button
                      type="button"
                      onClick={() => navigateTo('inventario')}
                      className="min-h-[38px] md:min-h-[40px] px-4 py-1.5 rounded-xl bg-[#9B2226] hover:bg-[#7D191D] text-white text-xs sm:text-sm font-semibold border border-[#B83B3F]/40 transition-colors cursor-pointer whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#D4A348]"
                    >
                      Comenzar Auditoría
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={() => navigateTo('resumen')}
                      className="min-h-[38px] md:min-h-[40px] px-4 py-1.5 rounded-xl bg-[#D4A348] hover:bg-[#C19139] text-[#11281E] text-xs sm:text-sm font-semibold transition-colors cursor-pointer whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#F2C97D]"
                    >
                      Exportar Resumen
                    </button>
                  )}
                </div>
              </div>
            </header>

            <main className="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 pb-24 md:pb-14">
              {activeScreen === 'bienvenida' && (
                <WelcomeScreen
                  onStartAudit={() => navigateTo('inventario')}
                  onNavigate={navigateTo}
                  hasExistingProgress={hasExistingProgress}
                />
              )}

              {activeScreen === 'inventario' && (
                <InventoryScreen
                  inventory={session.inventory}
                  analysis={session.analysis}
                  onChangeInventory={handleInventoryChange}
                  onAnalyze={handleAnalyzeInventory}
                  onGoToSomatic={handleGoToSomatic}
                  onNavigate={navigateTo}
                />
              )}

              {activeScreen === 'botiquin' && (
                <SomaticKitScreen
                  activeProtocol={activeSomaticProtocol}
                  onSelectProtocol={setActiveSomaticProtocol}
                  stats={session.somatic}
                  onCompleteBoxCycle={handleCompleteBoxCycle}
                  onCompleteAnchor={handleCompleteAnchor}
                  onCompleteFrequencyCut={handleCompleteFrequencyCut}
                  onNavigate={navigateTo}
                />
              )}

              {activeScreen === 'resumen' && (
                <SummaryScreen
                  session={session}
                  onChangeClosingIntention={handleClosingIntentionChange}
                  onNavigate={navigateTo}
                  onResetSession={handleResetSession}
                />
              )}
            </main>

            <footer className="border-t border-[#2B5240] bg-[#11281E] mb-14 md:mb-0 no-print">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-[#C7D6CE]">
                <p>
                  El Duelo Invisible · Kit Digital Interactivo basado en la obra de Carlos Luna PNL
                </p>
                <p>Tus escritos permanecen privados en este dispositivo.</p>
              </div>
            </footer>

            <nav
              aria-label="Navegación móvil"
              className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-[#11281E]/95 backdrop-blur-md border-t border-[#2B5240] no-print"
            >
              <div className="grid grid-cols-4 h-14 items-center">
                <button
                  type="button"
                  onClick={() => navigateTo('bienvenida')}
                  className={`flex flex-col items-center justify-center min-h-[44px] text-[11px] font-medium transition-colors cursor-pointer ${
                    activeScreen === 'bienvenida'
                      ? 'text-[#F2C97D] font-semibold'
                      : 'text-[#C7D6CE]'
                  }`}
                >
                  <IconBookOpen className="w-5 h-5" />
                  <span className="mt-0.5 whitespace-nowrap">Inicio</span>
                </button>

                <button
                  type="button"
                  onClick={() => navigateTo('inventario')}
                  className={`flex flex-col items-center justify-center min-h-[44px] text-[11px] font-medium transition-colors cursor-pointer ${
                    activeScreen === 'inventario'
                      ? 'text-[#F2C97D] font-semibold'
                      : 'text-[#C7D6CE]'
                  }`}
                >
                  <IconPenLine className="w-5 h-5" />
                  <span className="mt-0.5 whitespace-nowrap">Inventario</span>
                </button>

                <button
                  type="button"
                  onClick={() => navigateTo('botiquin')}
                  className={`flex flex-col items-center justify-center min-h-[44px] text-[11px] font-medium transition-colors cursor-pointer ${
                    activeScreen === 'botiquin'
                      ? 'text-[#F2C97D] font-semibold'
                      : 'text-[#C7D6CE]'
                  }`}
                >
                  <IconWind className="w-5 h-5" />
                  <span className="mt-0.5 whitespace-nowrap">Botiquín</span>
                </button>

                <button
                  type="button"
                  onClick={() => navigateTo('resumen')}
                  className={`flex flex-col items-center justify-center min-h-[44px] text-[11px] font-medium transition-colors cursor-pointer ${
                    activeScreen === 'resumen'
                      ? 'text-[#F2C97D] font-semibold'
                      : 'text-[#C7D6CE]'
                  }`}
                >
                  <IconFileText className="w-5 h-5" />
                  <span className="mt-0.5 whitespace-nowrap">Resumen</span>
                </button>
              </div>
            </nav>
          </div>
        );
      }

      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
